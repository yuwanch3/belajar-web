<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register</title>
    <link rel="stylesheet" href="register.css" />
  </head>
  <body>
    <main class="register-container">
      <form action="/register-endpoint" method="POST" autocomplete="on">
        <header class="form-header">
          <h1>Account Register</h1>
          <p>Please register to get started.</p>
        </header>

        <div class="form-group">
          <label for="username">Username:</label>
          <input
            type="text"
            id="usename"
            name="username"
            required
            placeholder="Your name"
            autocomplete="username"
          />
        </div>

        <div class="form-group">
          <label for="user-email">Email:</label>
          <input
            type="email"
            id="user-email"
            name="email"
            required
            placeholder="name@example.com"
            autocomplete="username"
          />
        </div>

        <div class="form-group">
          <div class="label-wrapper">
            <label for="user-password">Password:</label>
          </div>

          <input
            type="password"
            id="user-password"
            name="password"
            required
            placeholder="*******"
            autocomplete="new-password"
          />

          <div class="label-wrapper">
            <label for="user-password">Confirm password:</label>
          </div>

          <input
            type="password"
            id="user-password"
            name="password"
            required
            placeholder="*******"
            autocomplete="confirm-password"
          />
        </div>

        <footer class="form-action">
          <label class="checkbox-label">
            <input type="checkbox" name="terms" />
            <span
              >I agree to the
              <a href="/terms" target="_blank">Terms of Service</a> and
              <a href="/privacy" target="_blank">Privacy Policy</a>.</span
            >
          </label>

          <button type="submit" class="btn-submit">Sign Up</button>
        </footer>

        <p class="signin-redirect">
          Already have an account? <a href="/html/login.html">Sign In</a>
        </p>
      </form>
    </main>
  </body>
</html>
